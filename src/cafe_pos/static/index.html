<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Cafe POS — тест авторизації</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  fieldset { margin-bottom: 20px; padding: 12px; }
  input { display: block; width: 100%; margin: 6px 0; padding: 6px; box-sizing: border-box; }
  button { margin: 4px 4px 4px 0; padding: 6px 12px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>

<h2>Реєстрація</h2>
<fieldset>
  <input id="reg-email" placeholder="email" value="user@test.com">
  <input id="reg-password" placeholder="пароль" type="password" value="Password123">
  <button onclick="register()">Зареєструватись</button>
</fieldset>

<h2>Вхід</h2>
<fieldset>
  <input id="login-email" placeholder="email" value="user@test.com">
  <input id="login-password" placeholder="пароль" type="password" value="Password123">
  <button onclick="login()">Увійти</button>
</fieldset>

<h2>Перевірка доступу</h2>
<fieldset>
  <button onclick="callApi('/user/home')">GET /user/home</button>
  <button onclick="callApi('/admin/home')">GET /admin/home</button>
</fieldset>

<h3>Відповідь сервера:</h3>
<pre id="output">(тут з'явиться результат)</pre>

<script>
let token = null;

async function register() {
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  show(res.status, await res.json());
}

async function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const form = new URLSearchParams();
  form.set('username', email);
  form.set('password', password);
  const res = await fetch('/auth/login', { method: 'POST', body: form });
  const data = await res.json();
  if (res.ok) token = data.access_token;
  show(res.status, data);
}

async function callApi(path) {
  const res = await fetch(path, {
    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
  });
  show(res.status, await res.json());
}

function show(status, data) {
  document.getElementById('output').textContent =
    'Статус: ' + status + '\n' + JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
