<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Cafe POS — вхід</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <h1>Cafe POS</h1>

  <div id="error-msg" class="error" style="display:none;"></div>

  <div class="card">
    <h2>Вхід</h2>
    <div class="form-stack">
      <input id="login-email" placeholder="email" value="admin@test.com">
      <input id="login-password" placeholder="пароль" type="password" value="">
      <button class="primary" onclick="doLogin()">Увійти</button>
    </div>
  </div>

  <div class="card">
    <h2>Реєстрація (звичайний користувач)</h2>
    <div class="form-stack">
      <input id="reg-email" placeholder="email" value="user@test.com">
      <input id="reg-password" placeholder="пароль" type="password" value="Password123">
      <button class="primary" onclick="doRegister()">Зареєструватись</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
async function doLogin() {
  hideError();
  try {
    await login(document.getElementById('login-email').value, document.getElementById('login-password').value);
    location.href = isAdmin() ? 'dashboard.html' : 'products.html';
  } catch (e) { showError(e.message); }
}

async function doRegister() {
  hideError();
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) { showError(data.detail || 'Помилка реєстрації'); return; }
  alert('Зареєстровано! Тепер увійди зі своїм email і паролем.');
}
</script>
</body>
</html>
